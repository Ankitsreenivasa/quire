appId: com.sreenigo.pdfconverter
productName: PDF Converter
directories:
  output: dist
  buildResources: build
files:
  - out/**/*
  - package.json
asarUnpack:
  - node_modules/sharp/**/*
  - node_modules/@img/**/*
  - node_modules/@napi-rs/**/*
  - node_modules/ffmpeg-static/**/*
  - node_modules/ffprobe-static/**/*
# Every native dep ships as a prebuilt binary — no compile step on any runner.
npmRebuild: false
# CI attaches installers to the Release itself (softprops/action-gh-release);
# electron-builder is always invoked with --publish never.
publish: null
# Version-free file names so releases/latest/download/<name> permalinks stay valid.
mac:
  category: public.app-category.productivity
  icon: build/icon.icns
  identity: null
  artifactName: PDF-Converter-mac-${arch}.${ext}
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
win:
  icon: build/icon.ico
  artifactName: PDF-Converter-win-${arch}.${ext}
  target:
    - target: nsis
      arch: [x64]
linux:
  icon: build/icon.png
  category: Utility
  maintainer: Ankit Sreenivasa <ankit.sreeni@gmail.com>
  artifactName: PDF-Converter-linux-${arch}.${ext}
  target: [AppImage, deb]
